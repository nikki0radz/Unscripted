name = "unscripted-private-ai"
main = "worker.js"
compatibility_date = "2026-10-12"

[vars]
# Private diary uses same-origin requests. Leave legacy shared-origin access disabled.
ALLOWED_ORIGIN = ""

[assets]
directory = "../"
binding = "ASSETS"
run_worker_first = true

# After creating a PRIVATE R2 bucket, uncomment this binding and deploy again.
# [[r2_buckets]]
# binding = "DIARY_BACKUPS"
# bucket_name = "unscripted-backups"
