name = "unscripted-private-ai"
main = "worker.js"
compatibility_date = "2026-10-12"
compatibility_flags = ["nodejs_compat"]

[vars]
# Private diary uses same-origin requests. Leave legacy shared-origin access disabled.
ALLOWED_ORIGIN = ""

[assets]
directory = "../"
binding = "ASSETS"
run_worker_first = true

# Private encrypted backups. Keep this bucket's public access disabled.
[[r2_buckets]]
binding = "DIARY_BACKUPS"
bucket_name = "unscripted-backups"
